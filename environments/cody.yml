chatgpt:
  enabled: true
  config:
    model: gpt-4o-mini
    persona: "You are a helpful assistant robot. You respond with short phrases where possible."

controller_handler:
  enabled: true
  inject:
    controller: XboxController
  on_inject:
    - start
  config:
    debug: false
    modifier_buttons:
      - BTN_TL
      - BTN_TR
    mapping:
      default:
        BTN_TL:
          actions:
            - topic: ''
              args: {}
        BTN_TR:
          actions:
            - topic: ''
              args: {}
        BTN_SELECT:
          actions:
            - topic: 'record/stop'
              args: {}
        BTN_START:
          actions:
            - topic: 'record/start'
              args: {}
        KEY_RECORD: # Only on Xbox S/X remotes
          actions:
            - topic: ''
              args: {}
        BTN_MODE: # Xbox Logo
          actions:
            - topic: ''
              args: {}
        ABS_HAT0X: # DPAD X
          actions:
            - topic: ''
              args: {}
        ABS_HAT0Y: # DPAD Y
          actions:
            - topic: ''
              args: {}
        BTN_A:
          actions:
            - topic: 'tts'
              args: {msg: 'Test Default'}
        BTN_X:
          actions:
            - topic: 'eye/blink'
              args: {}
        BTN_Y:
          actions:
            - topic: 'gpio/laser/toggle'
              args: {}
        BTN_B:
          actions:
            - topic: 'vision/toggle'
              args: {}
        ABS_RX:
          actions:
            - topic: 'servo:neck_pan:mv'
              args: {}
              modifier:
                scale: 50  # max speed per event
        ABS_RZ:
          actions:
            - topic: 'servo:neck_tilt:mv'
              args: {}
              modifier:
                scale: -50
            - topic: 'servo:neck_tilt2:mv'
              args: {}
              modifier:
                scale: 50
        ABS_RY: # Right trigger
          start: -1.0
          actions:
            - topic: 'servo:leg_r_ankle:mv'
              args: {}
              modifier:
                scale: -50
        ABS_Z:  # Left trigger
          start: -1.0
          actions:
            - topic: 'servo:leg_l_ankle:mv'
              args: {}
              modifier:
                scale: -50
        ABS_X:
          actions:
            - topic: 'eye/move'
              args: {axis: 'y'}
              modifier:
                mapping: [0, 240]
        ABS_Y:
          actions:
            - topic: 'eye/move'
              args: {axis: 'x'}
              modifier:
                mapping: [240, 0]
      BTN_TL:
        BTN_X:
          actions:
            - topic: 'servo:neck_pan:mv'
              args: {delta: -50}
        BTN_Y:
          actions:
            - topic: 'servo:neck_tilt:mv'
              args: {delta: -50}
            - topic: 'servo:neck_tilt2:mv'
              args: {delta: 50}
        BTN_B:
          actions:
            - topic: 'servo:neck_pan:mv'
              args: {delta: 50}
        BTN_A:
          actions:
            - topic: 'servo:neck_tilt:mv'
              args: {delta: 50}
            - topic: 'servo:neck_tilt2:mv'
              args: {delta: -50}
      BTN_TR:
        BTN_X:
          actions:
            - topic: 'servo:neck_tilt:mv'
              args: {delta: 50}
        BTN_Y:
          actions:
            - topic: 'servo:neck_tilt:mv'
              args: {delta: -50}
        BTN_B:
          actions:
            - topic: 'servo:neck_tilt2:mv'
              args: {delta: 50}
        BTN_A:
          actions:
            - topic: 'servo:neck_tilt2:mv'
              args: {delta: -50}
        ABS_HAT0Y:
          actions:
            - topic: 'servo:neck_tilt:mvabs'
              args: {
                position: 511
              }
            - topic: 'servo:neck_tilt2:mvabs'
              args: {
                position: 511
              }
        ABS_X:
          actions:
            - topic: 'servo:leg_l_ankle:mv'
              modifier:
                scale: 50
            - topic: 'servo:leg_r_ankle:mv'
              modifier:
                scale: -50
            - topic: 'servo:leg_l_knee:mv'
              modifier:
                scale: 50
            - topic: 'servo:leg_r_knee:mv'
              modifier:
                scale: -50
            - topic: 'servo:leg_l_hip:mv'
              modifier:
                scale: 50
            - topic: 'servo:leg_r_hip:mv'
              modifier:
                scale: -50

gpio_laser:
  enabled: true
  config:
    pin: 6
    test_on_boot: false

gpio_motion:
  enabled: true
  config:
    pin: 9
    test_on_boot: false

gpio_read:
  enabled: false
  config:
    pin: 5
    test_on_boot: false

input_recorder:
  enabled: true
  config:
    animations_dir: animations/recorded

logwrapper:
  enabled: true # Highly recommended to enable this module
  config:
    filename: app.log
    log_level: 'debug' # debug, info, warning, error, critical
    cli_level: 'info' # debug, info, warning, error, critical

messaging_service:
  enabled: true # Required for framework to function
  config:
    protocol: 'pubsub' # 'mqtt' or 'pubsub' - something is wrong with mqtt that prevents the loops from executing correctly
    mqtt_host: 'localhost' 
    mqtt_port: 1883

oled_display:
  enabled: true
  config:
    reset_pin: 26 # Changed directly in waveshare config.py to avoid conflict with TFT display
    dc_pin: 24 # Changed directly in waveshare config.py to avoid conflict with TFT display

personality:
  enabled: true
  inject:
    servos: "Servo_*"
    imu.head: BNO055_imu_head
    imu.body: BNO055_imu_body
    vision: Vision
  config:
    mode: 6 # Config.MODE_LIVE
    sleep_timeout: 60  # Time in seconds before entering sleep mode

pitemperature:
  enabled: true

tft_display:
  enabled: true
  config:
    bus: 0 # Use `ls /dev/spi*` to identify. (/dev/spidev0.0) is bus 0, device 0
    device: 0 # Use `ls /dev/spi*` to identify. (/dev/spidev0.0) is bus 0, device 0
    rst_pin: 27
    dc_pin: 25
    bl_pin: 18 # Not used if no backlight pin on device
    rotation: -90.0
    test_on_boot: true
    colors:
      red: (255, 32, 32)
      blue: (0, 245, 255)
      green: (0, 255, 180)
      purple: (255, 0, 255)
      yellow: (255, 255, 0)
      white: (255, 255, 255)
      gray: (128, 128, 128)
      dark_gray: (64, 64, 64)

ttsmodule:
  enabled: true
  config:
    service: "elevenlabs"
    voice_id: "pMsXgVXv3BLzUgSXRplE"

tracking:
  enabled: false

vision_imx500:
  enabled: true
  config:
    preview: false

xbox_controller:
  enabled: true
  config:
    normalised: true
    debug: false
    device: '/dev/input/js0'  # Add this
    deadzone: 4000 # thumbsticks deadzone (seems to be needed for xbox controllers)
    button_names:  # Add this
      0: 'BTN_A'
      1: 'BTN_B'
      2: 'BTN_X'
      3: 'BTN_Y'
      4: 'BTN_TL'
      5: 'BTN_TR'
      6: 'BTN_SELECT'
      7: 'BTN_START'
      8: 'BTN_MODE'
      9: 'BTN_THUMBL'
      10: 'BTN_THUMBR'
      11: 'KEY_RECORD'  # Xbox Series controller
    axis_names:  # Add this
      0: 'ABS_X'
      1: 'ABS_Y'
      2: 'ABS_Z'
      3: 'ABS_RZ'
      4: 'ABS_RX'
      5: 'ABS_RY'
      6: 'ABS_HAT0X'
      7: 'ABS_HAT0Y'
    axis_max: 32767.0
    axis_min: -32767.0