

# Card name: cm5i2saudio  (ALSA normalises "cm5-i2s-audio" → "cm5i2saudio")
# The custom cm5-i2s-audio overlay creates a simple-audio-card with two DAI links:
#   device 1: MAX98357A speaker amplifier  (playback only)
#   device 0: ICS-43434 stereo mic pair    (capture only)
#
# With PipeWire running (default on Bookworm) pcm.!default is overridden by
# PipeWire's ALSA plugin.  The definitions below are used by CLI tools
# (aplay, arecord) that access ALSA directly.

pcm.speakerbonnet {
   type hw
   card cm5i2saudio
   device 1
}

pcm.dmixer {
   type dmix
   ipc_key 1024
   ipc_perm 0666
   slave {
     pcm "speakerbonnet"
     period_time 0
     period_size 1024
     buffer_size 8192
     rate 48000
     channels 2
     format S32_LE
   }
}

ctl.dmixer {
    type hw
    card cm5i2saudio
}

pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control.name "PCM"
    control.card cm5i2saudio
}

ctl.softvol {
    type hw
    card cm5i2saudio
}

# Separate playback and capture defaults using asym so that:
#   - aplay / speaker output uses the softvol/dmix chain
#   - arecord / microphone input uses the ICS-43434 capture device (hw:X,0)
# plug wrapper allows ALSA to convert format/rate for apps that don't natively
# support S32_LE / 48000 Hz (the only format the DW I2S hardware accepts).
pcm.mic_plug {
    type plug
    slave.pcm "hw:cm5i2saudio,0"
}

pcm.!default {
    type asym
    playback.pcm "softvol"
    capture.pcm "mic_plug"
}
